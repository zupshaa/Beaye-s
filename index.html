<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bayu's Booklet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage" id="stage">
  <div class="book" id="book" data-step="0">

    <!-- Leaf 1: front = cover (PDF 1), back = Page 2 envelope + letter (PDF 2/3/4) -->
    <section class="leaf" id="leaf1">
      <div class="face front">
        <button class="hit" id="openBook" aria-label="Open the booklet"></button>
        <img src="assets/cover.jpg" alt="Bayu's birthday booklet cover: a cherry cake" draggable="false">
        <span class="hint hint-cover">tap to open</span>
      </div>
      <div class="face back page2" id="page2">
        <img class="env closed" src="assets/envelope-closed.jpg" alt="" draggable="false">
        <img class="env open" src="assets/envelope-open.jpg" alt="" draggable="false">
        <button class="hit envelope" id="envelopeBtn" aria-label="Open the envelope"></button>
        <button class="letter" id="letter" aria-label="Read the letter larger" tabindex="-1">
          <img src="assets/letter.jpg" alt="The Daily News: a special-edition letter. Where ordinary days become history." draggable="false">
        </button>
      </div>
    </section>

    <!-- Leaf 2: front = Page 3 cake (PDF 5), back = Page 4 make a wish (PDF 6) -->
    <section class="leaf" id="leaf2">
      <div class="face front page3">
        <img src="assets/cake.jpg" alt="A cake with three candles. Blow out the candles!" draggable="false">
        <img class="flame" id="flame1" src="assets/flame1.png" alt="" style="left:29.188%;top:68.4%;width:4.625%">
        <img class="flame" id="flame2" src="assets/flame2.png" alt="" style="left:46.438%;top:62.25%;width:4.625%">
        <img class="flame" id="flame3" src="assets/flame3.png" alt="" style="left:62.312%;top:68.4%;width:4.625%">
        <button class="blow" id="blowBtn">Blow the candle <small id="left">3 left</small></button>
      </div>
      <div class="face back"><img src="assets/make-a-wish.jpg" alt="Make a wish… and may all your dreams come true" draggable="false"></div>
    </section>

    <!-- Leaf 4: Page 5 initial state (PDF 7). Flips away to reveal PDF 8 beneath. -->
    <section class="leaf" id="leaf4">
      <div class="face front">
        <button class="hit" id="wishBtn" aria-label="Turn the page to read my wish"></button>
        <img src="assets/made-your-wish.jpg" alt="Made your wish, yet?" draggable="false">
        <span class="curl" aria-hidden="true"></span>
        <span class="hint hint-wish">tap to turn the page</span>
      </div>
      <div class="face back paper"></div>
    </section>

    <!-- Leaf 3: front = Page 5 revealed state (PDF 8), back = Page 6 back cover (PDF 9) -->
    <section class="leaf" id="leaf3">
      <div class="face front">
        <button class="hit" id="closeBtn" aria-label="Close the booklet" disabled></button>
        <img src="assets/my-wish.jpg" alt="My wish: I am forever grateful for having you…" draggable="false">
        <span class="hint hint-close" id="closeHint">tap to close the book</span>
      </div>
      <div class="face back cover6">
        <img src="assets/back-cover.jpg" alt="I love you, forever and always." draggable="false">
        <button class="again" id="againBtn">read again</button>
      </div>
    </section>
  </div>

  <button class="pan pan-l" id="panL" aria-label="Show left page" hidden>&#8249;</button>
  <button class="pan pan-r" id="panR" aria-label="Show right page" hidden>&#8250;</button>
</main>

<div class="lightbox" id="lightbox" hidden>
  <img src="assets/letter.jpg" alt="The letter, enlarged">
  <button id="lbClose" aria-label="Close enlarged letter">&times;</button>
</div>
<script src="script.js"></script>
</body>
</html>
